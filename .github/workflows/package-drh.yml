name: Package DRH

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      fps:
        required: false
        type: string
        default: ""
      package_name:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  package:
    name: ${{ inputs.package_name }}
    runs-on: ${{ inputs.runner }}
    env:
      HXCPP_CONFIG: ${{ github.workspace }}/tools/release/hxcpp-ci.xml
      LIME_CONFIG: ${{ github.workspace }}/tools/release/lime-ci-config.xml
      # hxcpp keeps the game's objects here, each named after a hash of its source, headers,
      # options and compiler: see the cpp-cache step. 0 leaves the pruning to that step's script.
      HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.ci-cache/hxcpp
      HXCPP_CACHE_MB: "0"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          submodules: recursive

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffdec-fonts
          path: bin/obj/ffdec_fonts

      - name: Configure target frame rate
        shell: python
        env:
          TARGET_FPS: ${{ inputs.fps }}
        run: |
          import os
          from decimal import Decimal, InvalidOperation
          import xml.etree.ElementTree as ET

          project_path = "project.xml"
          tree = ET.parse(project_path)
          window = tree.getroot().find("window")
          if window is None:
              raise SystemExit("project.xml does not contain a window element")

          raw_fps = os.environ["TARGET_FPS"]
          if not raw_fps:
              raw_fps = window.get("fps", "")
          try:
              decimal_fps = Decimal(raw_fps)
          except InvalidOperation as error:
              raise SystemExit(f"Invalid target frame rate: {raw_fps!r}") from error

          if decimal_fps != decimal_fps.to_integral_value() or decimal_fps <= 0:
              raise SystemExit(f"Target frame rate must be a positive integer, got {raw_fps!r}")

          fps = str(int(decimal_fps))
          window.set("fps", fps)
          tree.write(project_path, encoding="utf-8", xml_declaration=True)
          print(f"Configured project.xml for {fps} FPS")

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.3.7

      - name: Generate SWF libraries
        shell: bash
        run: haxe edits/swf_libraries/generate.hxml

      - name: Configure macOS build environment
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun clang++ --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libpulse-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

          echo "CXX=g++-14" >> "$GITHUB_ENV"
          g++-14 --version

      - name: Install haxelib dependencies
        shell: bash
        run: |
          haxelib --quiet --always install format 3.8.0
          haxelib --quiet --always install hxp 1.3.1
          # Lime's dependencies, and CrossByte, which its command-line tools are built with
          haxelib --quiet --always install native-desktop 1.1.0
          haxelib --quiet --always install native-ipc 1.0.0
          haxelib --quiet --always install StageWebView 1.0.1
          haxelib --quiet --always install wsproto 1.0.0
          haxelib --quiet --always install crossbyte 1.0.1
          haxelib dev hxcpp "$PWD/submodules/libhxcpp"
          haxelib dev lime "$PWD/submodules/lime"
          haxelib dev openfl "$PWD/submodules/openfl"
          haxelib dev swf "$PWD/submodules/swf"
          haxelib dev steamwrap "$PWD/submodules/SteamWrap"
          haxelib dev hxscript "$PWD/submodules/hxscript"

      # ndlls and neko tools. A hit skips the rebuilds below. The key is the
      # native sources, so a game-only commit restores this and moves on.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: native-cache
        with:
          path: |
            submodules/lime/ndll
            submodules/lime/run.n
            submodules/lime/tools/tools.n
            submodules/swf/run.n
            submodules/libhxcpp/hxcpp.n
            submodules/SteamWrap/ndll
          key: native-${{ inputs.platform }}-nolto-${{ hashFiles('submodules/lime/**', 'submodules/libhxcpp/**', 'submodules/swf/**', 'submodules/SteamWrap/**', 'tools/release/hxcpp-ci.xml', 'tools/release/lime-ci-config.xml') }}

      - name: Bootstrap hxcpp
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd submodules/libhxcpp/tools/hxcpp
          haxe compile.hxml

      - name: Clone Steamworks SDK
        shell: bash
        run: |
          set -euo pipefail

          sdk_dir="$PWD/.ci-temp/SteamworksSDK"
          sdk_ref="be6107f4b75bf996531415c53a6488a33a2a1be3"

          rm -rf "$sdk_dir"
          mkdir -p "$sdk_dir"
          git -C "$sdk_dir" init
          git -C "$sdk_dir" remote add origin https://github.com/rlabrecque/SteamworksSDK.git
          git -C "$sdk_dir" fetch --depth 1 origin "$sdk_ref"
          git -C "$sdk_dir" checkout --detach FETCH_HEAD

          if [[ ! -d "$sdk_dir/redistributable_bin" || ! -d "$sdk_dir/public/steam" ]]; then
            echo "Steamworks SDK mirror has an unexpected layout." >&2
            echo "Expected redistributable_bin and public/steam in $sdk_dir." >&2
            exit 1
          fi

          echo "STEAMWORKS_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Configure SteamWrap
        shell: bash
        run: |
          set -euo pipefail

          steamwrap="submodules/SteamWrap"
          sdk="$STEAMWORKS_SDK_DIR"

          mkdir -p \
            "$steamwrap/native/include/steam" \
            "$steamwrap/native/include/hx" \
            "$steamwrap/native/lib/linux64" \
            "$steamwrap/native/lib/osx64" \
            "$steamwrap/native/lib/win32" \
            "$steamwrap/native/lib/win64"

          cp "$sdk"/public/steam/*.h "$steamwrap/native/include/steam/"
          cp submodules/libhxcpp/include/hx/*.h "$steamwrap/native/include/hx/"

          case "${{ inputs.platform }}" in
            linux)
              cp "$sdk/redistributable_bin/linux64/libsteam_api.so" "$steamwrap/native/lib/linux64/"
              ;;
            macos)
              if [[ -f "$sdk/redistributable_bin/osx/libsteam_api.dylib" ]]; then
                cp "$sdk/redistributable_bin/osx/libsteam_api.dylib" "$steamwrap/native/lib/osx64/"
              else
                cp "$sdk/redistributable_bin/osx32/libsteam_api.dylib" "$steamwrap/native/lib/osx64/"
              fi
              ;;
            windows)
              cp "$sdk/redistributable_bin/steam_api.dll" "$steamwrap/native/lib/win32/"
              cp "$sdk/redistributable_bin/steam_api.lib" "$steamwrap/native/lib/win32/"
              cp "$sdk/redistributable_bin/win64/steam_api64.dll" "$steamwrap/native/lib/win64/"
              cp "$sdk/redistributable_bin/win64/steam_api64.lib" "$steamwrap/native/lib/win64/"
              ;;
            *)
              echo "Unsupported platform: ${{ inputs.platform }}" >&2
              exit 1
              ;;
          esac

      - name: Rebuild Lime helper tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # lime rebuild cpp builds 32-bit too unless -64; Ubuntu 24.04 has no i386 headers.
          case "${{ inputs.platform }}" in
            linux)
              haxelib run lime rebuild cpp -debug -64
              ;;
            *)
              haxelib run lime rebuild cpp -debug
              ;;
          esac
          haxelib run lime rebuild tools
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild swf

      - name: Rebuild Lime native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.platform }}" in
            linux)
              haxelib run lime rebuild linux -64
              ;;
            windows)
              haxelib run lime rebuild windows -64
              ;;
            macos)
              haxelib run lime rebuild mac -x86_64 -DHXCPP_ARCH=x86_64
              haxelib run lime rebuild mac -arm64 -DHXCPP_ARCH=arm64
              ;;
          esac

      - name: Build SteamWrap
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd submodules/SteamWrap/native
          rm -rf ../obj

          case "${{ inputs.platform }}" in
            linux|windows)
              haxelib run hxcpp Build.xml -DHXCPP_M64
              ;;
            macos)
              haxelib run hxcpp Build.xml -DHXCPP_M64 -DHXCPP_ARCH=x86_64
              rm -rf ../obj
              haxelib run hxcpp Build.xml -DHXCPP_ARM64 -DHXCPP_ARCH=arm64
              ;;
          esac

      # The tool hash is part of the restore prefix, so a Lime or swf change does
      # not reuse old zips. A source-only change still restores the previous
      # tree; install then drops the libraries whose SWF hash differs.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: swf-cache
        with:
          path: .ci-cache/swf
          key: swf-libs-${{ hashFiles('submodules/swf/**', 'submodules/lime/src/lime/tools/AssetHelper.hx', 'tools/release/swf_cache.py') }}-${{ hashFiles('Resources/**/*.swf', 'src/_assets/**/*.swf', 'generated_swf_libraries.xml') }}
          restore-keys: |
            swf-libs-${{ hashFiles('submodules/swf/**', 'submodules/lime/src/lime/tools/AssetHelper.hx', 'tools/release/swf_cache.py') }}-

      # hxcpp's compile cache: an object is found again by what it was compiled from, not by
      # dates, which a fresh checkout makes newer than any restored object. Each run restores
      # the latest cache of its platform and saves its own, so a change recompiles the files it
      # touches, and a library or compiler change those whose headers or options it changes.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: cpp-cache
        with:
          path: .ci-cache/hxcpp
          key: hxcpp-objects-v1-${{ inputs.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hxcpp-objects-v1-${{ inputs.platform }}-

      - name: Install cached SWF libraries
        shell: bash
        run: python tools/release/swf_cache.py install --platform "${{ inputs.platform }}"

      - name: Build Linux
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          tag="${{ inputs.version }}"
          tag="${tag#V}"
          haxelib run openfl build project.xml cpp -Ddrh_tag="$tag"

      # The symbol tables, the functions' names, leave the binaries for files of their own,
      # kept beside the package: gdb and perf read one put next to its binary.
      - name: Split the Linux symbols
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          symbols="bin/linux/Dungeon Rampage Haxe symbols"
          mkdir -p "$symbols" dist
          for name in "Dungeon Rampage Haxe" lime.ndll steamwrap.ndll; do
            binary="bin/linux/bin/$name"
            objcopy --only-keep-debug "$binary" "$symbols/$name.debug"
            strip --strip-unneeded "$binary"
            objcopy --add-gnu-debuglink="$symbols/$name.debug" "$binary"
          done
          tar -C "bin/linux" -cJf "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Linux.symbols.tar.xz" "Dungeon Rampage Haxe symbols"

      - name: Package Linux
        if: inputs.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          package_dir="bin/linux/Dungeon Rampage Haxe"
          archive="dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Linux.tar.gz"

          rm -rf "$package_dir"
          mkdir -p dist
          mv "bin/linux/bin" "$package_dir"

          test -x "$package_dir/Dungeon Rampage Haxe"
          test -f "$package_dir/lime.ndll"
          test -f "$package_dir/steamwrap.ndll"
          test -f "$package_dir/libsteam_api.so"
          test -f "$package_dir/steam_appid.txt"
          test -n "$(find "$package_dir/Resources/ffdec_fonts" -name '*.ttf' | head -n 1)"

          tar -C "bin/linux" -czf "$archive" "Dungeon Rampage Haxe"

      - name: Build Windows
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          if ($tag.StartsWith("V")) { $tag = $tag.Substring(1) }
          # The functions' names go to a PDB kept beside the package: the executable has none
          $symbols = "$env:GITHUB_WORKSPACE/bin/windows/symbols" -replace '\\', '/'
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          haxelib run openfl build project.xml cpp "-Ddrh_tag=$tag" "-DHXCPP_PDB_FILE=$symbols/DungeonRampageHaxe.pdb"

      - name: Package Windows
        if: inputs.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageDir = "bin/windows/Dungeon Rampage Haxe"
          $archive = "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Windows.zip"

          Remove-Item -Recurse -Force $packageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Rename-Item -Path "bin/windows/bin" -NewName "Dungeon Rampage Haxe"

          if (!(Test-Path (Join-Path $packageDir "Dungeon Rampage Haxe.exe"))) { throw "Missing Windows executable" }
          if (!(Test-Path (Join-Path $packageDir "lime.ndll"))) { throw "Missing lime.ndll" }
          if (!(Test-Path (Join-Path $packageDir "steamwrap.ndll"))) { throw "Missing steamwrap.ndll" }
          if (!(Test-Path (Join-Path $packageDir "steam_api64.dll"))) { throw "Missing steam_api64.dll" }
          if (!(Test-Path (Join-Path $packageDir "steam_appid.txt"))) { throw "Missing steam_appid.txt" }
          $fonts = Get-ChildItem -Recurse -Filter *.ttf -ErrorAction SilentlyContinue (Join-Path $packageDir "Resources\ffdec_fonts")
          if ($fonts.Count -lt 1) { throw "Missing exported SWF fonts" }

          Compress-Archive -Path $packageDir -DestinationPath $archive -Force

          $pdb = "bin/windows/symbols/DungeonRampageHaxe.pdb"
          if (!(Test-Path $pdb)) { throw "Missing $pdb" }
          Compress-Archive -Path $pdb -DestinationPath "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.Windows.symbols.zip" -Force

      - name: Build and package macOS
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          output_zip="dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.macOS.zip"
          tag="${{ inputs.version }}"
          tag="${tag#V}"
          # HXCPP_DEBUG_LINK_AND_STRIP has hxcpp keep each architecture's executable as it was
          # linked, in its objects folder, before it strips the one of the app. On macOS it
          # changes nothing else: the objects are compiled as before.
          tools/macos/release_macos_all.sh \
            --output-zip "$output_zip" \
            -- -Ddrh_tag="$tag" -DHXCPP_DEBUG_LINK_AND_STRIP

          macos_app="bin/macos/bin/Dungeon Rampage Haxe.app"

          # The functions' names, kept beside the package: a dSYM per architecture, which lldb and
          # atos match to the app's executable by its UUID, and the same names as text.
          symbols="bin/macos/Dungeon Rampage Haxe symbols"
          mkdir -p "$symbols"
          for pair in x86_64:darwin64 arm64:darwinarm64; do
            arch="${pair%%:*}"
            unstripped="bin/macos/obj/obj/${pair##*:}/ApplicationMain"
            test -f "$unstripped"
            dsymutil "$unstripped" -o "$symbols/Dungeon Rampage Haxe-$arch.dSYM"
            nm -n "$unstripped" > "$symbols/Dungeon Rampage Haxe-$arch.symbols.txt"
            echo "$arch: $(wc -l < "$symbols/Dungeon Rampage Haxe-$arch.symbols.txt") symbols linked, $(nm -arch "$arch" "$macos_app/Contents/MacOS/Dungeon Rampage Haxe" | wc -l) left in the app"
            dwarfdump --uuid "$symbols/Dungeon Rampage Haxe-$arch.dSYM"
          done
          dwarfdump --uuid "$macos_app/Contents/MacOS/Dungeon Rampage Haxe"
          du -sh "$symbols"/*
          tar -C "bin/macos" -cJf "dist/Dungeon.Rampage.Haxe.${{ inputs.version }}.macOS.symbols.tar.xz" "Dungeon Rampage Haxe symbols"

          test -d "$macos_app"
          test -f "$macos_app/Contents/MacOS/lime.ndll"
          test -f "$macos_app/Contents/MacOS/steamwrap.ndll"
          test -f "$macos_app/Contents/MacOS/libsteam_api.dylib"
          test -f "$macos_app/Contents/MacOS/steam_appid.txt"
          test -n "$(find "$macos_app/Contents/Resources/Resources/ffdec_fonts" -name '*.ttf' | head -n 1)"

      # The objects this build did not link go, or the cache would keep every build's.
      - name: Prune the compile cache
        shell: bash
        run: python tools/release/prune_hxcpp_cache.py .ci-cache/hxcpp "bin/${{ inputs.platform }}/obj" --lists ${{ inputs.platform == 'macos' && '2' || '1' }}

      - name: Stage SWF libraries for cache
        shell: bash
        run: python tools/release/swf_cache.py stage --platform "${{ inputs.platform }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
